services:
  playground:
    image: python:3.13.5-slim@sha256:4c2cf9917bd1cbacc5e9b07320025bdb7cdf2df7b0ceaccb55e9dd7e30987419
    command: ["python", "/app/app.py"]
    environment:
      DATABASE_PATH: /data/soar.db
      PORT: "8080"
      RESPONSE_MODE: simulation
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./services/playground:/app:ro
      - playground-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  playground-data:
